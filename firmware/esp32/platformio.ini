; HIDRO SELF-SERVICE — firmware ESP32 (PlatformIO)
; El ESP32 NUNCA alimenta el motor directamente:
;   ESP32 -> relay -> contactor -> motor de hidrolavadora

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Dependencias de terceros. SIN esto el build falla con
; "ArduinoJson.h: No such file or directory": ArduinoJson no viene con el
; framework Arduino ni con la plataforma espressif32.
; v7 es obligatoria: el código usa la API nueva (JsonDocument sin tamaño,
; doc["data"].to<JsonObject>()), que no existe en v6.
lib_deps =
  bblanchon/ArduinoJson@^7.0.0

; Nivel de log del core (1=error, 3=info, 5=verbose)
build_flags =
  -DCORE_DEBUG_LEVEL=1

; Para producción: subir el firmware con el secret REAL del dispositivo
; (generado por el panel admin -> "Rotar secret"). NUNCA commitear secretos.
