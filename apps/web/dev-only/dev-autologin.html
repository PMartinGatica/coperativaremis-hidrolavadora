<!doctype html>
<html>
<head><meta charset="utf-8"><title>dev autologin</title></head>
<body>
<script>
// Helper SOLO para desarrollo: inicia sesión admin y redirige al panel.
(async () => {
  const res = await fetch('/api/admin/auth/login', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ email: 'admin@hidro.local', password: 'hidro-demo-2025' }),
  });
  const data = await res.json();
  if (data.token) {
    localStorage.setItem('hidro.admin.token', data.token);
    location.href = '/admin';
  } else {
    document.body.textContent = 'login fallido: ' + JSON.stringify(data);
  }
})();
</script>
</body>
</html>
