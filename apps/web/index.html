<!doctype html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F5EE" />
    <meta name="description" content="Hidrolavadora autoservicio de la Cooperativa de Remis de Ushuaia: ingresá tu patente, pagá con Mercado Pago y lavá." />
    <title>Hidrolavadora · Cooperativa de Remis Ushuaia</title>
    <!-- Tema antes del primer pintado. Archivo externo a propósito: la CSP de helmet
         (script-src 'self') bloquea scripts inline. Sin defer ni type=module. -->
    <script src="/theme-init.js"></script>
    <!-- App instalable (PWA) sin service worker: pagar exige red siempre (ADR-057). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Hidrolavadora" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
